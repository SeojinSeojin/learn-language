name: Generate bilingual Short
run-name: ${{ inputs.daily_episode != '' && format('Daily Short {0}', inputs.daily_episode) || 'Generate bilingual Short' }}

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic (dialogue: e.g. Ordering iced coffee at a café; vocab: e.g. Fruits)"
        type: string
        required: true
      mode:
        description: "dialogue = two characters talk; vocab = 8-15 basic words with pictures (scene is ignored)"
        type: choice
        options:
          - dialogue
          - vocab
        default: dialogue
      upload:
        description: "Upload to YouTube after generation (requires approval on the 'youtube' environment)"
        type: boolean
        default: false
      visibility:
        description: "YouTube privacy status"
        type: choice
        options:
          - private
          - unlisted
          - public
        default: private
      scene:
        description: "Scene preset (auto = Gemini picks one that fits the topic)"
        type: choice
        options:
          - auto
          - cafe
          - park
          - school
          - office
          - home
        default: auto
      tts_provider:
        description: "Speech provider (edge = Microsoft Edge TTS, no key or daily limit; gemini = Gemini TTS, 2 videos/day free)"
        type: choice
        options:
          - edge
          - gemini
        default: edge
      title_override:
        description: "Optional title override (empty = generated title)"
        type: string
        required: false
        default: ""
      description_override:
        description: "Optional description override (empty = generated description)"
        type: string
        required: false
        default: ""

      daily_episode:
        description: Internal daily publisher episode ID (leave blank for manual Shorts)
        type: string
        required: false
      prepared_script:
        description: "Internal: <preparation run ID>/<episode ID> of a validated script from a daily-scripts artifact (leave blank to generate with Gemini)"
        type: string
        required: false

permissions:
  contents: read

# Edge TTS runs can go in parallel (one group per run). Gemini TTS runs share one group so they never
# compete for the 3-requests-per-minute free-tier limit (GitHub keeps one waiting run and cancels older waiting ones).
concurrency:
  group: ${{ inputs.tts_provider == 'gemini' && 'short-gemini-tts' || format('short-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  generate:
    name: Generate Short
    if: >-
      inputs.daily_episode == '' ||
      (vars.DAILY_PUBLISH_ENABLED == 'true' && github.run_attempt == 1 &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.daily_episode != '' && 35 || 45 }}
    permissions:
      contents: read
      actions: read # download the prepared script artifact from the preparation run
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Prepared script (Daily batch): fetch this episode's file from the preparation run and validate it
      # before any media tooling or TTS. Generation then makes no Gemini request.
      - name: Resolve prepared script
        id: prepared
        if: inputs.prepared_script != ''
        env:
          PREPARED_SCRIPT: ${{ inputs.prepared_script }}
          DAILY_EPISODE: ${{ inputs.daily_episode }}
        run: |
          if ! [[ "$PREPARED_SCRIPT" =~ ^([0-9]+)/([a-z0-9][a-z0-9-]{0,63})$ ]]; then
            echo "::error title=Prepared script::prepared_script must be <run id>/<episode id>."; exit 1
          fi
          run_id="${BASH_REMATCH[1]}"
          episode="${BASH_REMATCH[2]}"
          if [ -n "$DAILY_EPISODE" ] && [ "$DAILY_EPISODE" != "$episode" ]; then
            echo "::error title=Prepared script::prepared_script is for $episode but daily_episode is $DAILY_EPISODE."; exit 1
          fi
          {
            echo "run_id=$run_id"
            echo "episode=$episode"
            echo "file=out/prepared/$episode.json"
          } >> "$GITHUB_OUTPUT"

      - name: Download prepared script
        id: download-prepared
        if: inputs.prepared_script != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: daily-scripts-*
          merge-multiple: true
          run-id: ${{ steps.prepared.outputs.run_id }}
          github-token: ${{ github.token }}
          path: out/prepared

      - name: Validate prepared script
        if: inputs.prepared_script != ''
        env:
          DOWNLOAD_OUTCOME: ${{ steps.download-prepared.outcome }}
          RUN_ID: ${{ steps.prepared.outputs.run_id }}
          PREPARED_FILE: ${{ steps.prepared.outputs.file }}
          PREPARED_EPISODE: ${{ steps.prepared.outputs.episode }}
          TOPIC: ${{ inputs.topic }}
          MODE: ${{ inputs.mode }}
        run: |
          if [ "$DOWNLOAD_OUTCOME" != "success" ]; then
            echo "::error title=Prepared script::No daily-scripts artifact could be downloaded from run $RUN_ID (expired, missing or still uploading)."
          fi
          npx tsx src/cli/check-prepared.ts --file="$PREPARED_FILE" --episode="$PREPARED_EPISODE" --mode="$MODE" --topic="$TOPIC"

      - name: Install ffmpeg (if missing)
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps --only-shell chromium

      - name: Set up Python (Edge TTS)
        if: inputs.tts_provider == 'edge'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-tts.txt

      - name: Install edge-tts
        if: inputs.tts_provider == 'edge'
        run: pip install -r requirements-tts.txt

      # Per-line TTS cache (provider + voice + exact text). Restored from earlier attempts of this same run,
      # so "Re-run failed jobs" reuses the lines that already succeeded.
      - name: Restore TTS line cache
        if: inputs.tts_provider == 'edge'
        uses: actions/cache/restore@v6
        with:
          path: .cache/tts
          key: tts-edge-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: tts-edge-${{ github.run_id }}-

      - name: Edge TTS smoke test (one Spanish + one Korean line)
        if: inputs.tts_provider == 'edge'
        env:
          TTS_PROVIDER: edge
          EDGE_TTS_VOICE_LUPITA_ES: ${{ vars.EDGE_TTS_VOICE_LUPITA_ES }}
          EDGE_TTS_VOICE_LUPITA_KO: ${{ vars.EDGE_TTS_VOICE_LUPITA_KO }}
          EDGE_TTS_VOICE_JISOO_ES: ${{ vars.EDGE_TTS_VOICE_JISOO_ES }}
          EDGE_TTS_VOICE_JISOO_KO: ${{ vars.EDGE_TTS_VOICE_JISOO_KO }}
        run: npm run tts:smoke -- --out=out/tts-smoke

      - name: Generate Short
        id: generate
        env:
          # A prepared script with Edge TTS needs no Gemini key (and the code blocks any Gemini request).
          GEMINI_API_KEY: ${{ (inputs.prepared_script == '' || inputs.tts_provider == 'gemini') && secrets.GEMINI_API_KEY || '' }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL }}
          GEMINI_TTS_RPM: ${{ vars.GEMINI_TTS_RPM }}
          GEMINI_TTS_VOICE_LUPITA_ES: ${{ vars.GEMINI_TTS_VOICE_LUPITA_ES }}
          GEMINI_TTS_VOICE_LUPITA_KO: ${{ vars.GEMINI_TTS_VOICE_LUPITA_KO }}
          GEMINI_TTS_VOICE_JISOO_ES: ${{ vars.GEMINI_TTS_VOICE_JISOO_ES }}
          GEMINI_TTS_VOICE_JISOO_KO: ${{ vars.GEMINI_TTS_VOICE_JISOO_KO }}
          TTS_PROVIDER: ${{ inputs.tts_provider }}
          EDGE_TTS_VOICE_LUPITA_ES: ${{ vars.EDGE_TTS_VOICE_LUPITA_ES }}
          EDGE_TTS_VOICE_LUPITA_KO: ${{ vars.EDGE_TTS_VOICE_LUPITA_KO }}
          EDGE_TTS_VOICE_JISOO_ES: ${{ vars.EDGE_TTS_VOICE_JISOO_ES }}
          EDGE_TTS_VOICE_JISOO_KO: ${{ vars.EDGE_TTS_VOICE_JISOO_KO }}
          TOPIC: ${{ inputs.topic }}
          MODE: ${{ inputs.mode }}
          SCENE: ${{ inputs.scene }}
          VISIBILITY: ${{ inputs.visibility }}
          TITLE_OVERRIDE: ${{ inputs.title_override }}
          DESCRIPTION_OVERRIDE: ${{ inputs.description_override }}
          PREPARED_FILE: ${{ steps.prepared.outputs.file }}
          PREPARED_EPISODE: ${{ steps.prepared.outputs.episode }}
        run: |
          prepared=()
          if [ -n "$PREPARED_FILE" ]; then prepared=(--prepared="$PREPARED_FILE" --episode="$PREPARED_EPISODE"); fi
          npm run generate -- \
            --mode="$MODE" \
            --topic="$TOPIC" \
            --scene="$SCENE" \
            --out=out/job \
            --privacy="$VISIBILITY" \
            --title="$TITLE_OVERRIDE" \
            --description="$DESCRIPTION_OVERRIDE" \
            "${prepared[@]}"

      - name: Provider quota stop
        if: failure() && steps.generate.outputs.provider_quota == 'true'
        run: echo 'Generation provider quota or rate limit exhausted.'

      - name: Save TTS line cache
        if: always() && inputs.tts_provider == 'edge'
        uses: actions/cache/save@v6
        with:
          path: .cache/tts
          key: tts-edge-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Write metadata to run summary
        env:
          DAILY_EPISODE: ${{ inputs.daily_episode }}
        run: |
          node -e '
            const fs = require("node:fs");
            const m = JSON.parse(fs.readFileSync("out/job/metadata.json", "utf8"));
            const fence = "~~~~~~~~";
            const lines = [
              "## Generated Short metadata",
              "",
              process.env.DAILY_EPISODE ? "Daily episode " + process.env.DAILY_EPISODE : "Review before approving the `youtube` environment.",
              "",
              "**Title**",
              "",
              fence + "text",
              String(m.title ?? ""),
              fence,
              "",
              "**Visibility:** `" + String(m.privacyStatus ?? "").replace(/`/g, "") + "`",
              "",
              "**Tags:** " + (Array.isArray(m.tags) ? m.tags.map(String).join(", ").replace(/[<>]/g, "") : ""),
              "",
              "**Description**",
              "",
              fence + "text",
              String(m.description ?? ""),
              fence,
              "",
            ];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          '

      - name: Upload Short artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: short-${{ github.run_id }}
          path: |
            out/job/short.mp4
            out/job/script.json
            out/job/metadata.json
            out/job/timeline.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload script for debugging (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: debug-script-${{ github.run_id }}
          path: out/job/script.json
          if-no-files-found: ignore
          retention-days: 7

  upload:
    name: Upload to YouTube
    needs: generate
    if: inputs.upload == true
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.daily_episode != '' && 15 || 20 }}
    environment: ${{ inputs.daily_episode != '' && 'youtube-daily' || 'youtube' }}
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download Short artifact
        uses: actions/download-artifact@v8
        with:
          name: short-${{ github.run_id }}
          path: out/job

      - name: Upload to YouTube
        id: youtube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          VISIBILITY: ${{ inputs.visibility }}
          DAILY_EPISODE: ${{ inputs.daily_episode }}
          GH_TOKEN: ${{ github.token }}
        run: |
          npm run youtube:upload -- \
            --video out/job/short.mp4 \
            --metadata out/job/metadata.json \
            --privacy="$VISIBILITY"

      - name: Provider quota stop
        if: failure() && steps.youtube.outputs.provider_quota == 'true'
        run: echo 'YouTube provider quota exhausted.'

      - name: Write upload result to run summary
        if: success()
        env:
          VIDEO_URL: ${{ steps.youtube.outputs.video_url }}
        run: |
          if [ -n "$VIDEO_URL" ]; then
            printf '## Uploaded\n\n%s\n' "$VIDEO_URL" >> "$GITHUB_STEP_SUMMARY"
          fi
