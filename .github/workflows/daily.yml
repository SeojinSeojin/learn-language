name: Publish daily bilingual Shorts

on:
  schedule:
    - cron: '17 3 * * *'
      timezone: America/New_York
  workflow_dispatch:
    inputs:
      action:
        description: Preview without uploading, or retry unfinished episodes
        type: choice
        options:
          - preview
          - retry
        default: preview
      date:
        description: Intended publishing date (YYYY-MM-DD in New York; optional for preview)
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: daily-publish-controller
  cancel-in-progress: false

jobs:
  daily:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      ((github.event_name == 'workflow_dispatch' && inputs.action == 'preview') ||
       vars.DAILY_PUBLISH_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Plan and publish
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DAILY_MODE: ${{ github.event_name == 'schedule' && 'scheduled' || inputs.action }}
          DAILY_DATE: ${{ inputs.date }}
        run: npx tsx src/daily/publish.ts
